# MIP Section 4.2
# Phase 2.1 deviation: model now trained on delta-v (velocity increment per window),
# not absolute velocity. See implementation_plan.md Section 2.1 for rationale
# (MQN/DLAIDR arXiv:2407.16387, ~20% RMSE improvement).
# At inference time: accumulate delta-v predictions in RealVelocityEstimator.
model:
  input_channels: 6         # accel xyz, gyro xyz
  window_length: 500        # 5s @ 100Hz
  tcn_channels: [32, 64, 64, 128]
  tcn_dilations: [16, 32, 64, 128] # Expanded for 500-sample window (5s).
                                   # New RF covers the window fully.
                                   # No latency-budget impact - dilation doesn't add taps
                                   # or params, just spaces the existing 3 out further.
                                   # No latency-budget impact - dilation doesn't add taps
                                   # or params, just spaces the existing 3 out further.
  kernel_size: 3
  dropout: 0.3              # Increased from 0.2: train R2=0.79 vs val R2=0.10 diagnosed
                            # as a generalization gap; extra dropout regularizes without
                            # changing architecture.

loss:
  name: huber
  delta: 1.0                # Phase 2.3: reverted to 1.0 for absolute velocity scale.
                            # MIP specified 1.0 (tuned for absolute velocity range ~0-30 m/s).
                            # delta-v range is ~+/-2 m/s; 0.55 = 75th pct of |delta_v|
                            # (from diagnose_channel_a.py --check-delta-v output),
                            # so L2/L1 transition is inside the typical error distribution.

optimizer:
  name: adam
  lr: 5.0e-4                # Reduced from 1e-3: finer convergence for delta-v regression
  schedule: reduce_on_plateau
  schedule_factor: 0.5
  schedule_patience: 8

train:
  batch_size: 64
  epochs: 100
  early_stopping_patience: 15
  gradient_clip_max_norm: 5

target:
  metric: velocity_rmse_mps  # NOTE: for delta-v mode, this is RMSE of velocity INCREMENT,
                              # not absolute velocity. The absolute velocity RMSE is measured
                              # by accumulating predictions in diagnose_channel_a.py.
  threshold: 0.5             # delta-v RMSE < 0.5 m/s per window (tighter than absolute,
                              # achievable given delta-v std=0.72 in training data)
